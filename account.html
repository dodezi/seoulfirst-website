<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 변경 | 서울퍼스트내과의원</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey:"AIzaSyDJ09WizY9hxfszG_AbCnlydkoKwh0CiHo", authDomain:"seoulfirst-ba9d4.firebaseapp.com",
      projectId:"seoulfirst-ba9d4", storageBucket:"seoulfirst-ba9d4.firebasestorage.app",
      messagingSenderId:"702099053597", appId:"1:702099053597:web:27efd596ee2156a8fefaf4"
    });
    const auth = firebase.auth();
  </script>
  <style>
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Noto Sans KR',sans-serif; background:#f4f6f9; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 14px; }
    .card { background:#fff; border-radius:18px; width:400px; max-width:100%; box-shadow:0 10px 40px rgba(0,0,0,.12); padding:34px 32px 28px; }
    h1 { font-size:19px; font-weight:700; color:#0f2b3d; text-align:center; margin-bottom:6px; }
    .who { font-size:13px; color:#8a96a2; text-align:center; margin-bottom:22px; }
    .ff { margin-bottom:14px; }
    .ff label { display:block; font-size:12.5px; font-weight:600; color:#5a6b7a; margin-bottom:5px; }
    .ff input { width:100%; padding:12px 14px; border:1.5px solid #dde1e7; border-radius:9px; font-size:15px; font-family:inherit; }
    .ff input:focus { outline:none; border-color:#0d7377; }
    .btn { width:100%; padding:13px; background:#0d7377; color:#fff; border:none; border-radius:9px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:6px; }
    .btn:disabled { opacity:.6; cursor:default; }
    .msg { font-size:13px; text-align:center; min-height:18px; margin-top:12px; color:#c0392b; }
    .links { text-align:center; margin-top:16px; font-size:13px; }
    .links a { color:#0d7377; text-decoration:none; font-weight:600; }
    .loading { text-align:center; color:#7a8794; padding:40px 0; }
  </style>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1a3a5c" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
</head>
<body>
  <div class="card">
    <div id="loadingBox" class="loading">불러오는 중…</div>
    <div id="formBox" style="display:none;">
      <h1>🔑 비밀번호 변경</h1>
      <div class="who" id="who"></div>
      <div class="ff"><label>현재 비밀번호</label><input type="password" id="curPw" autocomplete="current-password" /></div>
      <div class="ff"><label>새 비밀번호 (6자 이상)</label><input type="password" id="newPw" autocomplete="new-password" /></div>
      <div class="ff"><label>새 비밀번호 확인</label><input type="password" id="newPw2" autocomplete="new-password" /></div>
      <button class="btn" id="btnSave">변경하기</button>
      <div class="msg" id="msg"></div>
      <div class="links"><a href="admin.html">← 관리홈으로</a></div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const msg = $('msg');
let curUser = null;

auth.onAuthStateChanged(user => {
  if(!user){ location.replace('portal.html'); return; }
  curUser = user;
  $('loadingBox').style.display = 'none';
  $('formBox').style.display = 'block';
  $('who').textContent = user.email;
});

$('btnSave').addEventListener('click', save);
$('newPw2').addEventListener('keydown', e => { if(e.key==='Enter') save(); });

async function save(){
  const cur = $('curPw').value, np = $('newPw').value, np2 = $('newPw2').value;
  msg.style.color = '#c0392b'; msg.textContent = '';
  if(!cur){ msg.textContent='현재 비밀번호를 입력해 주세요.'; return; }
  if(np.length < 6){ msg.textContent='새 비밀번호는 6자 이상이어야 합니다.'; return; }
  if(np !== np2){ msg.textContent='새 비밀번호가 일치하지 않습니다.'; return; }
  const btn = $('btnSave'); btn.disabled = true; btn.textContent = '변경 중...';
  try {
    // 보안을 위해 현재 비밀번호로 재인증 후 변경
    const cred = firebase.auth.EmailAuthProvider.credential(curUser.email, cur);
    await curUser.reauthenticateWithCredential(cred);
    await curUser.updatePassword(np);
    try { await firebase.firestore().collection('audit_logs').add({
      actor: curUser.email, category:'auth', action:'비밀번호 변경', detail:'', page:'account.html',
      at: firebase.firestore.FieldValue.serverTimestamp()
    }); } catch(e){}
    msg.style.color = '#1e7a3a';
    msg.textContent = '✅ 비밀번호가 변경되었습니다.';
    $('curPw').value=''; $('newPw').value=''; $('newPw2').value='';
    btn.disabled = false; btn.textContent = '변경하기';
  } catch(e){
    btn.disabled = false; btn.textContent = '변경하기';
    if(e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') msg.textContent = '현재 비밀번호가 올바르지 않습니다.';
    else if(e.code === 'auth/weak-password') msg.textContent = '새 비밀번호가 너무 약합니다.';
    else msg.textContent = '변경 오류: ' + e.message;
  }
}
</script>
</body>
</html>
