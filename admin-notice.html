<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공지사항 관리 | 서울퍼스트내과의원</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    // ============================================================
    //  Firebase 설정 — notice.html 과 동일한 값으로 교체하세요
    // ============================================================
    const firebaseConfig = {
      apiKey:            "AIzaSyDJ09WizY9hxfszG_AbCnlydkoKwh0CiHo",
      authDomain:        "seoulfirst-ba9d4.firebaseapp.com",
      projectId:         "seoulfirst-ba9d4",
      storageBucket:     "seoulfirst-ba9d4.firebasestorage.app",
      messagingSenderId: "702099053597",
      appId:             "1:702099053597:web:27efd596ee2156a8fefaf4",
      measurementId:     "G-TYXZ511SVG"
    };
    firebase.initializeApp(firebaseConfig);
    const db   = firebase.firestore();
    const auth = firebase.auth();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f4f6f9; color: #1e2a38; min-height: 100vh; }

    /* ── 로그인 화면 ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #fff; border-radius: 16px; padding: 48px 40px;
      width: 360px; box-shadow: 0 8px 40px rgba(0,0,0,.12);
    }
    .login-box .logo { text-align: center; margin-bottom: 28px; }
    .login-box .logo img { height: 40px; }
    .login-box h2 { font-size: 20px; font-weight: 700; margin-bottom: 24px; text-align: center; color: #0f2b3d; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 11px 14px; border: 1.5px solid #dde1e7;
      border-radius: 8px; font-size: 15px; font-family: inherit;
      transition: border .2s;
    }
    .form-group input:focus { outline: none; border-color: #0d7377; }
    .btn-login {
      width: 100%; padding: 13px; background: #0d7377; color: #fff;
      border: none; border-radius: 8px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: background .2s; margin-top: 8px;
    }
    .btn-login:hover { background: #0a5a5d; }
    #login-error { color: #c0392b; font-size: 13px; margin-top: 10px; text-align: center; min-height: 20px; }

    /* ── 관리자 화면 ── */
    #admin-screen { display: none; }
    .admin-header {
      background: #0f2b3d; color: #fff; padding: 0 32px;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .admin-header .h-logo { display: flex; align-items: center; gap: 12px; }
    .admin-header .h-logo img { height: 28px; }
    .admin-header .h-logo span { font-size: 15px; font-weight: 700; }
    .admin-header .h-user { display: flex; align-items: center; gap: 16px; font-size: 13px; }
    .btn-logout {
      background: rgba(255,255,255,.15); color: #fff; border: none;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
      transition: background .2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,.25); }

    .admin-body { max-width: 860px; margin: 0 auto; padding: 36px 20px; }

    /* ── 툴바 ── */
    .admin-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .admin-toolbar h1 { font-size: 22px; font-weight: 700; color: #0f2b3d; }
    .btn-new {
      background: #0d7377; color: #fff; border: none;
      padding: 10px 22px; border-radius: 8px; font-size: 15px;
      font-weight: 600; cursor: pointer; transition: background .2s;
    }
    .btn-new:hover { background: #0a5a5d; }

    /* ── 게시판 테이블 ── */
    .notice-table-wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.07); overflow: hidden; }
    .n-header {
      display: flex; align-items: center; padding: 12px 16px;
      border-bottom: 2px solid #0f2b3d;
      font-size: 13px; font-weight: 700; color: #666;
    }
    .n-col-num  { flex: 0 0 60px; text-align: center; }
    .n-col-pin  { flex: 0 0 60px; text-align: center; }
    .n-col-title{ flex: 1; }
    .n-col-date { flex: 0 0 100px; text-align: center; }
    .n-col-act  { flex: 0 0 120px; text-align: center; }

    .n-row {
      display: flex; align-items: center; padding: 13px 16px;
      border-bottom: 1px solid #eef0f4; font-size: 14px;
      transition: background .15s;
    }
    .n-row:last-child { border-bottom: none; }
    .n-row:hover { background: #f8fafc; }
    .n-row.pinned { background: rgba(13,115,119,.05); }
    .n-row .n-col-num { color: #aaa; font-size: 13px; font-weight: 600; }
    .n-row .n-col-num.pin-mark { color: #0d7377; }
    .n-row .n-col-title { font-weight: 500; color: #1e2a38; }
    .n-row .n-col-title .pin-badge {
      display: inline-block; background: #0d7377; color: #fff;
      font-size: 10px; padding: 2px 7px; border-radius: 4px;
      margin-right: 8px; font-weight: 700; vertical-align: middle;
    }
    .n-row .n-col-date { color: #aaa; font-size: 13px; text-align: center; }

    .btn-edit, .btn-del {
      border: none; padding: 5px 12px; border-radius: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity .2s;
    }
    .btn-edit { background: #eaf4f4; color: #0d7377; margin-right: 6px; }
    .btn-edit:hover { opacity: .75; }
    .btn-del  { background: #fdecea; color: #c0392b; }
    .btn-del:hover  { opacity: .75; }

    #admin-list-empty {
      text-align: center; padding: 48px; color: #aaa; font-size: 15px;
    }

    /* ── 글쓰기/수정 모달 ── */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 500;
      align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #fff; border-radius: 16px;
      width: min(680px, 95vw); max-height: 90vh;
      overflow-y: auto; padding: 36px 32px; position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .modal-close {
      position: absolute; top: 16px; right: 20px;
      font-size: 22px; cursor: pointer; color: #aaa;
      background: none; border: none;
    }
    .modal-box h2 { font-size: 20px; font-weight: 700; color: #0f2b3d; margin-bottom: 24px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
    .field input[type=text],
    .field textarea {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #dde1e7; border-radius: 8px;
      font-size: 15px; font-family: inherit;
      transition: border .2s;
    }
    .field input[type=text]:focus,
    .field textarea:focus { outline: none; border-color: #0d7377; }
    .field textarea { min-height: 200px; resize: vertical; line-height: 1.7; }
    .field-pin { display: flex; align-items: center; gap: 10px; }
    .field-pin input[type=checkbox] { width: 18px; height: 18px; accent-color: #0d7377; cursor: pointer; }
    .field-pin label { font-size: 14px; font-weight: 500; color: #333; cursor: pointer; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .btn-cancel {
      padding: 10px 22px; background: #f0f2f5; color: #555;
      border: none; border-radius: 8px; font-size: 15px;
      font-weight: 600; cursor: pointer;
    }
    .btn-save {
      padding: 10px 28px; background: #0d7377; color: #fff;
      border: none; border-radius: 8px; font-size: 15px;
      font-weight: 600; cursor: pointer; transition: background .2s;
    }
    .btn-save:hover { background: #0a5a5d; }
    .btn-save:disabled { background: #aaa; cursor: not-allowed; }

    /* ── 삭제 확인 모달 ── */
    .confirm-box {
      background: #fff; border-radius: 16px; padding: 32px 28px;
      width: 340px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .confirm-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 10px; color: #0f2b3d; }
    .confirm-box p { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.6; }
    .confirm-actions { display: flex; gap: 10px; justify-content: center; }
    .btn-confirm-del {
      padding: 10px 24px; background: #e74c3c; color: #fff;
      border: none; border-radius: 8px; font-size: 15px;
      font-weight: 600; cursor: pointer;
    }
    .btn-confirm-del:hover { background: #c0392b; }

    /* ── 토스트 알림 ── */
    #toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #0f2b3d; color: #fff; padding: 12px 28px;
      border-radius: 10px; font-size: 14px; font-weight: 600;
      opacity: 0; transition: all .3s; pointer-events: none; z-index: 9999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      .admin-body { padding: 20px 12px; }
      .n-col-pin, .n-col-num { flex: 0 0 40px; }
      .n-col-act { flex: 0 0 90px; }
    }
  </style>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1a3a5c" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

</head>
<body>

<!-- ===================== 로그인 화면 ===================== -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">
      <img src="images/logo.png" alt="서울퍼스트내과 로고" />
    </div>
    <h2>공지사항 관리자</h2>
    <div class="form-group">
      <label for="login-email">이메일</label>
      <input type="email" id="login-email" placeholder="관리자 이메일" autocomplete="username" />
    </div>
    <div class="form-group">
      <label for="login-pw">비밀번호</label>
      <input type="password" id="login-pw" placeholder="비밀번호" autocomplete="current-password" />
    </div>
    <button class="btn-login" id="btn-login">로그인</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ===================== 관리자 화면 ===================== -->
<div id="admin-screen">
  <header class="admin-header">
    <div class="h-logo">
      <img src="images/logo.png" alt="로고" />
      <span>공지사항 관리</span>
    </div>
    <div class="h-user">
      <span id="admin-email"></span>
      <button class="btn-logout" id="btn-logout">로그아웃</button>
      <a href="notice.html" style="color:rgba(255,255,255,.7);font-size:13px;text-decoration:none;">← 공개 게시판</a>
    </div>
  </header>

  <div class="admin-body">
    <div class="admin-toolbar">
      <h1>📋 공지사항 목록</h1>
      <button class="btn-new" id="btn-new-post">+ 새 글 작성</button>
    </div>

    <div class="notice-table-wrap">
      <div class="n-header">
        <div class="n-col-num">번호</div>
        <div class="n-col-pin">📌</div>
        <div class="n-col-title">제목</div>
        <div class="n-col-date">날짜</div>
        <div class="n-col-act">관리</div>
      </div>
      <div id="admin-list">
        <div id="admin-list-empty">글을 불러오는 중...</div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== 글쓰기/수정 모달 ===================== -->
<div class="modal-backdrop" id="editModal">
  <div class="modal-box">
    <button class="modal-close" id="editModalClose">✕</button>
    <h2 id="editModalTitle">새 글 작성</h2>
    <input type="hidden" id="edit-doc-id" />
    <div class="field">
      <label for="edit-title">제목 <span style="color:#e74c3c">*</span></label>
      <input type="text" id="edit-title" placeholder="공지 제목을 입력하세요" maxlength="100" />
    </div>
    <div class="field">
      <label for="edit-content">내용 <span style="color:#e74c3c">*</span></label>
      <textarea id="edit-content" placeholder="공지 내용을 입력하세요&#10;&#10;줄바꿈은 그대로 표시됩니다."></textarea>
    </div>
    <div class="field">
      <div class="field-pin">
        <input type="checkbox" id="edit-pinned" />
        <label for="edit-pinned">📌 상단 고정 공지로 설정</label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="editModalCancel">취소</button>
      <button class="btn-save" id="editModalSave">저장하기</button>
    </div>
  </div>
</div>

<!-- ===================== 삭제 확인 모달 ===================== -->
<div class="modal-backdrop" id="deleteModal">
  <div class="confirm-box">
    <h3>글을 삭제할까요?</h3>
    <p id="delete-title-preview" style="font-weight:600;color:#333;margin-bottom:8px;"></p>
    <p>삭제한 글은 복구할 수 없습니다.</p>
    <div class="confirm-actions">
      <button class="btn-cancel" id="deleteModalCancel">취소</button>
      <button class="btn-confirm-del" id="deleteModalConfirm">삭제</button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div id="toast"></div>

<script>
// ── 상태 ─────────────────────────────────────────────────
let currentDocs = [];    // { id, data } 배열
let deleteTargetId = null;

// ── 로그인 ────────────────────────────────────────────────
document.getElementById('btn-login').addEventListener('click', login);
document.getElementById('login-pw').addEventListener('keydown', e => { if(e.key==='Enter') login(); });

function login() {
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !pw) { errEl.textContent = '이메일과 비밀번호를 입력해 주세요.'; return; }

  document.getElementById('btn-login').textContent = '로그인 중...';
  auth.signInWithEmailAndPassword(email, pw)
    .catch(err => {
      let msg = '로그인에 실패했습니다.';
      if (err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') msg = '이메일 또는 비밀번호가 올바르지 않습니다.';
      if (err.code === 'auth/invalid-email') msg = '올바른 이메일 형식이 아닙니다.';
      if (err.code === 'auth/too-many-requests') msg = '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.';
      errEl.textContent = msg;
      document.getElementById('btn-login').textContent = '로그인';
    });
}

// ── 인증 상태 감지 ────────────────────────────────────────
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    document.getElementById('admin-email').textContent = user.email;
    loadAdminList();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('admin-screen').style.display = 'none';
    document.getElementById('btn-login').textContent = '로그인';
  }
});

// ── 로그아웃 ──────────────────────────────────────────────
document.getElementById('btn-logout').addEventListener('click', () => auth.signOut());

// ── 목록 불러오기 ─────────────────────────────────────────
async function loadAdminList() {
  const listEl = document.getElementById('admin-list');
  try {
    const snap = await db.collection('notices')
      .orderBy('createdAt', 'desc')
      .get();

    // 핀 고정 먼저, 최신순 — JS 정렬
    currentDocs = snap.docs
      .map(d => ({ id: d.id, data: d.data() }))
      .sort((a, b) => (b.data.pinned ? 1 : 0) - (a.data.pinned ? 1 : 0));

    if (snap.empty) {
      listEl.innerHTML = '<div id="admin-list-empty">등록된 공지사항이 없습니다. 새 글을 작성해 보세요.</div>';
      return;
    }

    let normalNum = 0;
    listEl.innerHTML = currentDocs.map(({ id, data: d }) => {
      const isPinned = !!d.pinned;
      if (!isPinned) normalNum++;
      const dateStr = d.createdAt
        ? new Date(d.createdAt.seconds * 1000).toLocaleDateString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\. /g,'.').replace(/\.$/,'')
        : '-';
      return `
        <div class="n-row${isPinned?' pinned':''}">
          <div class="n-col-num${isPinned?' pin-mark':''}">${isPinned ? '📌' : normalNum}</div>
          <div class="n-col-pin">${isPinned ? '✅' : ''}</div>
          <div class="n-col-title">
            ${isPinned ? '<span class="pin-badge">공지</span>' : ''}
            ${escHtml(d.title||'(제목 없음)')}
          </div>
          <div class="n-col-date">${dateStr}</div>
          <div class="n-col-act">
            <button class="btn-edit" onclick="openEditModal('${id}')">수정</button>
            <button class="btn-del"  onclick="openDeleteModal('${id}')">삭제</button>
          </div>
        </div>`;
    }).join('');

  } catch(e) {
    listEl.innerHTML = '<div id="admin-list-empty" style="color:#c0392b;">목록을 불러오지 못했습니다.</div>';
    console.error(e);
  }
}

// ── 새 글 작성 모달 ───────────────────────────────────────
document.getElementById('btn-new-post').addEventListener('click', () => {
  document.getElementById('editModalTitle').textContent = '새 글 작성';
  document.getElementById('edit-doc-id').value = '';
  document.getElementById('edit-title').value = '';
  document.getElementById('edit-content').value = '';
  document.getElementById('edit-pinned').checked = false;
  openModal('editModal');
});

// ── 수정 모달 열기 ────────────────────────────────────────
function openEditModal(docId) {
  const item = currentDocs.find(d => d.id === docId);
  if (!item) return;
  const d = item.data;
  document.getElementById('editModalTitle').textContent = '공지 수정';
  document.getElementById('edit-doc-id').value = docId;
  document.getElementById('edit-title').value = d.title || '';
  document.getElementById('edit-content').value = d.content || '';
  document.getElementById('edit-pinned').checked = !!d.pinned;
  openModal('editModal');
}

// ── 저장 ──────────────────────────────────────────────────
document.getElementById('editModalSave').addEventListener('click', async () => {
  const title   = document.getElementById('edit-title').value.trim();
  const content = document.getElementById('edit-content').value.trim();
  const pinned  = document.getElementById('edit-pinned').checked;
  const docId   = document.getElementById('edit-doc-id').value;

  if (!title) { alert('제목을 입력해 주세요.'); return; }
  if (!content) { alert('내용을 입력해 주세요.'); return; }

  const saveBtn = document.getElementById('editModalSave');
  saveBtn.disabled = true;
  saveBtn.textContent = '저장 중...';

  try {
    if (docId) {
      // 수정
      await db.collection('notices').doc(docId).update({
        title, content, pinned,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } else {
      // 신규
      await db.collection('notices').add({
        title, content, pinned,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    closeModal('editModal');
    await loadAdminList();
    showToast(docId ? '✅ 수정되었습니다.' : '✅ 새 공지가 등록되었습니다.');
  } catch(e) {
    alert('저장 중 오류가 발생했습니다: ' + e.message);
    console.error(e);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '저장하기';
  }
});

// ── 삭제 모달 ─────────────────────────────────────────────
function openDeleteModal(docId) {
  deleteTargetId = docId;
  const item = currentDocs.find(d => d.id === docId);
  document.getElementById('delete-title-preview').textContent = item ? `"${item.data.title}"` : '';
  openModal('deleteModal');
}

document.getElementById('deleteModalConfirm').addEventListener('click', async () => {
  if (!deleteTargetId) return;
  try {
    await db.collection('notices').doc(deleteTargetId).delete();
    closeModal('deleteModal');
    await loadAdminList();
    showToast('🗑️ 삭제되었습니다.');
  } catch(e) {
    alert('삭제 중 오류가 발생했습니다: ' + e.message);
  }
  deleteTargetId = null;
});

// ── 모달 공통 ─────────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}

['editModal','deleteModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e) {
    if (e.target === this) closeModal(id);
  });
});
document.getElementById('editModalClose').addEventListener('click', () => closeModal('editModal'));
document.getElementById('editModalCancel').addEventListener('click', () => closeModal('editModal'));
document.getElementById('deleteModalCancel').addEventListener('click', () => closeModal('deleteModal'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    ['editModal','deleteModal'].forEach(id => closeModal(id));
  }
});

// ── 토스트 알림 ───────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
