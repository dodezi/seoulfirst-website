<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | 서울퍼스트내과의원</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey:"AIzaSyDJ09WizY9hxfszG_AbCnlydkoKwh0CiHo", authDomain:"seoulfirst-ba9d4.firebaseapp.com",
      projectId:"seoulfirst-ba9d4", storageBucket:"seoulfirst-ba9d4.firebasestorage.app",
      messagingSenderId:"702099053597", appId:"1:702099053597:web:27efd596ee2156a8fefaf4"
    });
    const auth = firebase.auth();
  </script>
  <style>
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Noto Sans KR',sans-serif; background:linear-gradient(135deg,#1a3a5c,#2980b9); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 14px; }
    .card { background:#fff; border-radius:18px; width:380px; max-width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3); padding:40px 34px 30px; }
    .logo { text-align:center; margin-bottom:8px; }
    .logo img { height:36px; }
    h1 { font-size:18px; font-weight:700; color:#0f2b3d; text-align:center; margin-bottom:24px; }
    .ff { margin-bottom:14px; }
    .ff label { display:block; font-size:12.5px; font-weight:600; color:#5a6b7a; margin-bottom:5px; }
    .ff input { width:100%; padding:12px 14px; border:1.5px solid #dde1e7; border-radius:9px; font-size:15px; font-family:inherit; }
    .ff input:focus { outline:none; border-color:#0d7377; }
    .btn { width:100%; padding:14px; background:#0d7377; color:#fff; border:none; border-radius:9px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:6px; }
    .btn:disabled { opacity:.6; cursor:default; }
    .msg { font-size:13px; text-align:center; min-height:18px; margin-top:12px; color:#c0392b; }
    .links { display:flex; justify-content:space-between; margin-top:18px; font-size:13px; }
    .links a { color:#0d7377; text-decoration:none; font-weight:600; cursor:pointer; }
    .loading { text-align:center; color:#7a8794; font-size:14px; padding:40px 0; }
  </style>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1a3a5c" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="서울퍼스트" />
</head>
<body>
  <div class="card">
    <div id="loginBox">
      <div class="logo"><img src="images/logo.png" alt="로고" /></div>
      <h1>서울퍼스트내과 관리시스템</h1>
      <div class="ff"><label>이메일</label><input type="email" id="email" placeholder="이메일" autocomplete="username" /></div>
      <div class="ff"><label>비밀번호</label><input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" /></div>
      <button class="btn" id="btnLogin">로그인</button>
      <div class="msg" id="msg"></div>
      <div class="links">
        <a href="signup.html">직원 가입 신청</a>
        <a id="resetLink">비밀번호 찾기</a>
      </div>
    </div>
    <div id="checkingBox" class="loading" style="display:none;">로그인 확인 중…</div>
  </div>

<script>
const $ = id => document.getElementById(id);
const msg = $('msg');
$('btnLogin').addEventListener('click', login);
$('pw').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
$('resetLink').addEventListener('click', resetPw);

// 이미 로그인돼 있으면 바로 런처로
auth.onAuthStateChanged(user => {
  if (user) { location.replace('admin.html'); }
});

async function login(){
  const email = $('email').value.trim();
  const pw = $('pw').value;
  msg.textContent = '';
  if(!email || !pw){ msg.textContent = '이메일과 비밀번호를 입력해 주세요.'; return; }
  const btn = $('btnLogin'); btn.disabled = true; btn.textContent = '로그인 중...';
  try {
    await auth.signInWithEmailAndPassword(email, pw);
    try { await firebase.firestore().collection('audit_logs').add({
      actor: email, category:'auth', action:'로그인', detail:'', page:'portal.html',
      at: firebase.firestore.FieldValue.serverTimestamp()
    }); } catch(e){}
    location.replace('admin.html');
  } catch(e){
    btn.disabled = false; btn.textContent = '로그인';
    msg.textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
  }
}
async function resetPw(){
  const email = $('email').value.trim();
  if(!email){ msg.textContent = '먼저 이메일을 입력한 뒤 "비밀번호 찾기"를 눌러 주세요.'; return; }
  try { await auth.sendPasswordResetEmail(email); msg.style.color='#1e7a3a'; msg.textContent='재설정 메일을 보냈습니다. 메일함을 확인하세요.'; }
  catch(e){ msg.style.color='#c0392b'; msg.textContent='메일 발송 실패: 이메일을 확인해 주세요.'; }
}
</script>
</body>
</html>
