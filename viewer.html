<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울퍼스트내과 의료관리시스템</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Malgun Gothic','맑은 고딕', sans-serif;
  display: flex;
  flex-direction: column;
  background: #f4f6f8;
}
.topbar {
  flex: 0 0 auto;
  background: linear-gradient(135deg, #1a3a5c 0%, #2980b9 100%);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.topbar a.home {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,.15);
  color: #fff;
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  padding: 8px 14px;
  border-radius: 8px;
  transition: background .15s;
}
.topbar a.home:hover { background: rgba(255,255,255,.28); }
.topbar .title {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -.3px;
}
.topbar .title small { font-weight: 400; opacity: .65; margin-left: 8px; font-size: 12px; }
.topbar .spacer { flex: 1; }
.topbar button.newwin {
  background: #fff;
  color: #1a3a5c;
  border: none;
  font-weight: 700;
  font-size: 13px;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: opacity .15s;
}
.topbar button.newwin:hover { opacity: .85; }
.stage { flex: 1 1 auto; position: relative; min-height: 0; }
iframe { width: 100%; height: 100%; border: none; display: block; background: #fff; }
.fallback {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px;
  gap: 16px;
  background: #f4f6f8;
}
.fallback.show { display: flex; }
.fallback .icon { font-size: 56px; }
.fallback h2 { color: #1a3a5c; font-size: 20px; }
.fallback p { color: #5d6d7e; font-size: 14px; line-height: 1.7; max-width: 420px; }
.fallback button {
  background: linear-gradient(135deg, #1a3a5c 0%, #2980b9 100%);
  color: #fff;
  border: none;
  font-weight: 700;
  font-size: 15px;
  padding: 14px 28px;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(41,128,185,.35);
}
.fallback button:hover { opacity: .92; }
</style>
</head>
<body>
<div class="topbar">
  <a class="home" href="admin.html">🏠 홈으로</a>
  <span class="title" id="title">불러오는 중…</span>
  <span class="spacer"></span>
  <button class="newwin" id="newwin">새 창에서 열기 ↗</button>
</div>
<div class="stage">
  <iframe id="frame" referrerpolicy="no-referrer"></iframe>
  <div class="fallback" id="fallback">
    <div class="icon">🔒</div>
    <h2 id="fbTitle">앱 안에서 열 수 없는 사이트입니다</h2>
    <p>이 사이트는 보안 정책상 다른 페이지(앱) 안에 표시되는 것을 허용하지 않습니다.
       아래 버튼을 누르면 새 창에서 바로 사용할 수 있습니다. 사용 후 이 창으로 돌아와 <b>🏠 홈으로</b>를 누르세요.</p>
    <button id="fbOpen">새 창에서 사이트 열기 ↗</button>
  </div>
</div>

<script>
// 앱 화이트리스트 — 외부 URL은 여기서만 결정 (쿼리로 임의 URL 주입 방지)
var APPS = {
  drug: {
    title: '의약품 식별',
    sub: 'health.kr',
    url: 'https://health.kr/searchIdentity/Search.asp',
    embeddable: false   // health.kr은 frame-ancestors로 iframe 차단됨
  },
  parking: {
    title: '주차 등록·관리',
    sub: 'HUMAX PARCS',
    url: 'https://console.humax-parcs.com/store',
    embeddable: true
  }
};

function getParam(name) {
  return new URLSearchParams(location.search).get(name);
}

var key = getParam('app');
var app = APPS[key];

var titleEl = document.getElementById('title');
var frame = document.getElementById('frame');
var fallback = document.getElementById('fallback');
var fbTitle = document.getElementById('fbTitle');

if (!app) {
  titleEl.textContent = '알 수 없는 항목';
  fbTitle.textContent = '연결할 사이트를 찾을 수 없습니다';
  fallback.classList.add('show');
  frame.style.display = 'none';
} else {
  document.title = app.title + ' — 서울퍼스트내과';
  titleEl.innerHTML = app.title + ' <small>' + app.sub + '</small>';

  function openNewWindow() { window.open(app.url, '_blank', 'noopener'); }
  document.getElementById('newwin').onclick = openNewWindow;
  document.getElementById('fbOpen').onclick = openNewWindow;

  if (app.embeddable) {
    frame.src = app.url;
    // 혹시 모를 차단 대비: 일정 시간 안에 로드 신호 없으면 폴백 안내 표시
    var loaded = false;
    frame.addEventListener('load', function () { loaded = true; });
    setTimeout(function () {
      if (!loaded) {
        fbTitle.textContent = '사이트 응답이 늦습니다';
        fallback.classList.add('show');
      }
    }, 8000);
  } else {
    // iframe이 차단되는 사이트 → 바로 안내 화면
    frame.style.display = 'none';
    fallback.classList.add('show');
  }
}
</script>
</body>
</html>
